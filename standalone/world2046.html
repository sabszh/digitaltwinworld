<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World 2046</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Orbitron:wght@400;500;700&family=Share+Tech+Mono&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ─── Reset ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body { font-family: 'Space Grotesk', sans-serif; background: #020c1a; color: #f7f6f1; overflow: hidden; height: 100dvh; }

/* ─── CSS Variables ──────────────────────────────────────────── */
:root {
  --night: #061b34;
  --midnight: #020c1a;
  --sky-deep: #0a3055;
  --sky: #1c6fa8;
  --haze: #a8cde8;
  --cloud: #f7f6f1;
  --signal: #3c83cf;
  --amber: #f2a76d;
  --glass: rgba(255,255,255,0.78);
  --glass-strong: rgba(255,255,255,0.94);

  --text: var(--cloud);
  --muted: rgba(247,246,241,0.72);
  --faint: rgba(247,246,241,0.44);
  --accent: #8fc7e8;
  --accent-warm: #f2c879;
  --panel: rgba(16,35,43,0.90);
  --card: rgba(143,199,232,0.07);
  --control: rgba(143,199,232,0.10);
  --line: rgba(143,199,232,0.18);

  --font-editorial: 'Fraunces', 'Georgia', serif;
  --font-display: 'Orbitron', sans-serif;
  --font-mono: 'Share Tech Mono', monospace;
  --font-body: 'Space Grotesk', sans-serif;
}

/* ─── Sky scope (light theme for panels) ────────────────────── */
.sky-scope {
  --text: var(--night);
  --muted: rgba(6,27,52,0.74);
  --faint: rgba(6,27,52,0.42);
  --accent: var(--signal);
  --accent-warm: #c47a2e;
  --panel: rgba(255,255,255,0.82);
  --card: rgba(6,27,52,0.05);
  --control: rgba(6,27,52,0.06);
  --line: rgba(6,27,52,0.12);
}

/* ─── Typography ─────────────────────────────────────────────── */
.font-display { font-family: var(--font-display); }
.font-editorial { font-family: var(--font-editorial); font-style: italic; }
.font-mono { font-family: var(--font-mono); }

/* ─── Panels & Surfaces ──────────────────────────────────────── */
.surface-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.surface-card {
  background: var(--card);
  border: 1px solid var(--line);
}
.surface-control {
  background: var(--control);
  border: 1px solid var(--line);
  transition: background 0.18s, border-color 0.18s, transform 0.12s;
  cursor: pointer;
}
.surface-control:hover {
  background: rgba(143,199,232,0.16);
  border-color: rgba(143,199,232,0.4);
  transform: translateY(-1px);
}

/* ─── Backgrounds ────────────────────────────────────────────── */
#globe-container {
  position: fixed; inset: 0; z-index: 0;
  display: flex; align-items: center; justify-content: center;
}
.globe-sphere {
  width: min(90vw, 90vh);
  height: min(90vw, 90vh);
  border-radius: 50%;
  background: radial-gradient(ellipse at 35% 30%, #1c6fa8 0%, #0a3055 40%, #020c1a 75%);
  box-shadow: 0 0 80px rgba(60,131,207,0.3), inset 0 0 60px rgba(0,0,0,0.5);
  animation: globe-spin 40s linear infinite;
  position: relative;
  overflow: hidden;
  transition: transform 1.2s cubic-bezier(0.4,0,0.2,1), opacity 0.8s;
}
.globe-sphere::before {
  content: '';
  position: absolute; inset: 0; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(143,199,232,0.04) 0deg, transparent 20deg, rgba(143,199,232,0.04) 40deg);
  animation: globe-spin 20s linear infinite reverse;
}
.globe-sphere::after {
  content: '';
  position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(ellipse at 70% 25%, rgba(255,255,255,0.18) 0%, transparent 50%);
}
@keyframes globe-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.globe-sphere.zoomed {
  transform: scale(3.5) translateY(30%);
  opacity: 0.3;
}

/* Sky backdrop */
.bg-sky {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(180deg, var(--midnight) 0%, var(--sky-deep) 22%, var(--sky) 52%, var(--haze) 78%, var(--cloud) 100%);
  transition: opacity 0.7s;
}
.bg-cloud-band {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background:
    radial-gradient(ellipse 90% 28% at 20% 78%, rgba(255,255,255,0.52) 0%, transparent 100%),
    radial-gradient(ellipse 70% 22% at 75% 85%, rgba(255,255,255,0.38) 0%, transparent 100%),
    radial-gradient(ellipse 55% 18% at 50% 92%, rgba(247,246,241,0.44) 0%, transparent 100%);
  animation: cloud-drift 28s ease-in-out infinite alternate;
  transition: opacity 0.7s;
}
@keyframes cloud-drift {
  0% { transform: translateX(0); }
  100% { transform: translateX(2%); }
}

.starfield {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background-image:
    radial-gradient(1px 1px at 15% 22%, rgba(255,255,255,0.85) 0%, transparent 100%),
    radial-gradient(1px 1px at 42% 8%, rgba(255,255,255,0.7) 0%, transparent 100%),
    radial-gradient(1px 1px at 67% 31%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 88% 15%, rgba(255,255,255,0.9) 0%, transparent 100%),
    radial-gradient(1px 1px at 31% 44%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 74% 57%, rgba(255,255,255,0.65) 0%, transparent 100%),
    radial-gradient(1px 1px at 55% 72%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(2px 2px at 8% 88%, rgba(143,199,232,0.7) 0%, transparent 100%),
    radial-gradient(1px 1px at 93% 76%, rgba(255,255,255,0.55) 0%, transparent 100%),
    radial-gradient(1px 1px at 21% 64%, rgba(255,255,255,0.45) 0%, transparent 100%);
}
.aurora {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse 80% 40% at 50% 85%, rgba(60,131,207,0.16) 0%, transparent 70%);
  animation: aurora-drift 8s ease-in-out infinite alternate;
}
@keyframes aurora-drift {
  0% { opacity: 0.5; transform: scaleX(0.9); }
  100% { opacity: 1; transform: scaleX(1.1); }
}

/* Vignette */
.vignette {
  position: fixed; inset: 0; z-index: 2; pointer-events: none;
  background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.4) 100%);
}

/* ─── Layout ─────────────────────────────────────────────────── */
#app { position: relative; height: 100dvh; overflow: hidden; }
.phase { display: none; position: relative; z-index: 10; height: 100dvh; }
.phase.active { display: flex; flex-direction: column; }

/* ─── Intro ───────────────────────────────────────────────────── */
#phase-intro {
  overflow-y: auto; overflow-x: hidden;
  scroll-snap-type: y mandatory;
}
.intro-section {
  height: 100dvh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 2rem;
  scroll-snap-align: start;
  position: relative;
}
.intro-scrim {
  position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(46% 38% at 50% 50%, rgba(0,0,0,0.55), rgba(0,0,0,0.18) 55%, transparent 72%);
}
.horizon-title {
  font-family: var(--font-display);
  font-size: clamp(2.5rem, 8vw, 6rem);
  font-weight: 700;
  letter-spacing: 0.05em;
  color: #fff;
  text-shadow: 0 0 60px rgba(143,199,232,0.4);
  position: relative; z-index: 2;
}
.horizon-subtitle {
  margin-top: 1.5rem; position: relative; z-index: 2;
  max-width: 40rem;
}
.horizon-subtitle p {
  color: rgba(255,255,255,0.72);
  font-size: 1.1rem; line-height: 1.7;
  font-weight: 300;
  margin-top: 0.5rem;
}
.horizon-lead {
  font-family: var(--font-editorial);
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  color: rgba(255,255,255,0.9);
  line-height: 1.3; margin-bottom: 1rem;
  position: relative; z-index: 2;
}
.cta-button {
  display: inline-flex; align-items: center; gap: 0.5rem;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 0.85rem 2.2rem;
  border: 1px solid rgba(143,199,232,0.6);
  background: rgba(143,199,232,0.1);
  color: #fff;
  border-radius: 9999px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, transform 0.15s;
  position: relative; z-index: 2;
  margin-top: 2rem;
}
.cta-button:hover {
  background: rgba(143,199,232,0.22);
  border-color: rgba(143,199,232,0.9);
  transform: translateY(-2px);
}

/* ─── Language toggle ────────────────────────────────────────── */
#lang-toggle {
  position: fixed; top: 1rem; right: 1rem; z-index: 50;
  display: flex; gap: 0.25rem;
}
.lang-btn {
  font-family: var(--font-mono); font-size: 0.75rem;
  padding: 0.4rem 0.75rem;
  border: 1px solid rgba(143,199,232,0.3);
  background: rgba(0,0,0,0.3);
  color: rgba(255,255,255,0.7);
  border-radius: 0.5rem; cursor: pointer;
  transition: all 0.2s;
}
.lang-btn.active {
  background: rgba(143,199,232,0.2);
  border-color: rgba(143,199,232,0.7);
  color: #fff;
}

/* ─── Boarding Pass / Persona ────────────────────────────────── */
#phase-persona {
  align-items: center; justify-content: center; padding: 1rem;
}
.boarding-pass-container {
  width: 100%; max-width: 580px;
}
.boarding-pass {
  background: rgba(255,255,255,0.9);
  border-radius: 1.25rem;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(6,27,52,0.25);
}
.boarding-header {
  background: var(--night);
  color: rgba(247,246,241,0.9);
  padding: 1rem 1.5rem;
  display: flex; align-items: center; justify-content: space-between;
}
.boarding-header .airline {
  font-family: var(--font-display);
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  opacity: 0.7;
}
.boarding-header .flight {
  font-family: var(--font-mono);
  font-size: 0.85rem;
}
.ticket-fields {
  display: flex; flex-direction: column;
  border-top: 1px solid rgba(6,27,52,0.1);
}
.ticket-field {
  padding: 1rem 1.5rem;
  border-bottom: 1px dashed rgba(6,27,52,0.15);
  cursor: pointer;
  transition: background 0.15s;
}
.ticket-field:hover { background: rgba(6,27,52,0.03); }
.ticket-field:last-child { border-bottom: none; }
.ticket-label {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(6,27,52,0.5);
  margin-bottom: 0.3rem;
}
.ticket-value {
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--night);
  min-height: 1.4em;
}
.ticket-value.placeholder { color: rgba(6,27,52,0.3); font-weight: 400; }
.ticket-expansion {
  display: none; padding: 0 1.5rem 1.25rem;
  background: rgba(6,27,52,0.02);
}
.ticket-expansion.open { display: block; }
.role-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 0.5rem; margin-top: 0.5rem;
}
.role-btn {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.6rem 0.75rem;
  background: rgba(255,255,255,0.9);
  border: 1px solid rgba(6,27,52,0.15);
  border-radius: 0.75rem;
  cursor: pointer; font-family: var(--font-body);
  font-size: 0.85rem; font-weight: 500;
  color: var(--night);
  transition: all 0.15s;
}
.role-btn:hover, .role-btn.selected {
  border-color: var(--signal);
  background: rgba(60,131,207,0.08);
  color: var(--signal);
}
.role-index {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  width: 1.4rem; height: 1.4rem;
  border-radius: 50%;
  border: 1px solid currentColor;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.6;
}
.text-chips {
  display: flex; flex-wrap: wrap; gap: 0.4rem;
  margin-bottom: 0.6rem;
}
.chip {
  padding: 0.3rem 0.7rem;
  border: 1px solid rgba(6,27,52,0.2);
  border-radius: 9999px;
  font-size: 0.78rem; cursor: pointer;
  color: var(--night); background: #fff;
  transition: all 0.15s;
}
.chip:hover, .chip.active {
  background: rgba(60,131,207,0.1);
  border-color: var(--signal);
  color: var(--signal);
}
.text-input {
  width: 100%; resize: none;
  border: 1px solid rgba(6,27,52,0.15);
  border-radius: 0.75rem;
  padding: 0.6rem 0.75rem;
  font-family: var(--font-body); font-size: 0.9rem;
  color: var(--night); background: #fff;
  outline: none; min-height: 3.5rem;
  transition: border-color 0.15s;
}
.text-input:focus { border-color: var(--signal); }
.ticket-footer {
  padding: 1rem 1.5rem;
  border-top: 2px dashed rgba(6,27,52,0.15);
  background: rgba(6,27,52,0.02);
}
.ticket-launch {
  width: 100%;
  padding: 0.85rem;
  background: var(--night);
  color: var(--cloud);
  border: none; border-radius: 0.875rem;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
}
.ticket-launch:disabled { opacity: 0.35; cursor: default; }
.ticket-launch:not(:disabled):hover { opacity: 0.85; transform: translateY(-1px); }

/* Boarding stub (persona reveal) */
.boarding-stub {
  display: none;
  background: rgba(255,255,255,0.93);
  border-radius: 1.25rem;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(6,27,52,0.25);
  padding: 1.75rem;
}
.boarding-stub.visible { display: block; }
.stub-kicker {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(6,27,52,0.45);
}
.stub-title {
  font-family: var(--font-editorial);
  font-size: 1.9rem;
  color: var(--night);
  line-height: 1.2;
  margin-top: 0.5rem;
}
.stub-route {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--signal);
  margin-top: 0.5rem;
  letter-spacing: 0.06em;
}
.stub-divider {
  border: none;
  border-top: 1px dashed rgba(6,27,52,0.25);
  margin: 1rem 0;
}
.stub-traits {
  display: flex; flex-wrap: wrap; gap: 0.4rem;
  margin-bottom: 0.75rem;
}
.stub-trait {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  padding: 0.25rem 0.6rem;
  border: 1px solid rgba(6,27,52,0.18);
  border-radius: 0.5rem;
  color: rgba(6,27,52,0.6);
}
.stub-notes {
  font-size: 0.9rem;
  line-height: 1.6;
  color: rgba(6,27,52,0.68);
  margin-bottom: 1rem;
}
.board-btn {
  width: 100%;
  padding: 0.9rem;
  background: var(--night);
  color: var(--cloud);
  border: none; border-radius: 0.875rem;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
}
.board-btn:hover { opacity: 0.85; transform: translateY(-1px); }

/* Loading state */
.loading-indicator {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 1.5rem;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: rgba(6,27,52,0.55);
  letter-spacing: 0.06em;
}
.loading-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--signal);
  animation: loading-pulse 1.2s ease-in-out infinite;
}
.loading-dot:nth-child(2) { animation-delay: 0.2s; }
.loading-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes loading-pulse {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

/* ─── Travel Transition ──────────────────────────────────────── */
#phase-traveling {
  align-items: center; justify-content: center;
  background: rgba(255,255,255,0.08);
}
.travel-center { text-align: center; position: relative; }
.year-counter {
  display: inline-flex; gap: 0.3rem;
  margin-bottom: 1.5rem;
}
.flip-digit {
  position: relative;
  width: 1.75rem; height: 2.5rem;
  background: var(--night);
  border-radius: 0.4rem;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  box-shadow: inset 0 -2px 4px rgba(0,0,0,0.4);
  font-family: var(--font-mono);
  font-size: 1.3rem;
  color: var(--cloud);
}
.flip-digit::after {
  content: '';
  position: absolute; left: 0; right: 0; top: 50%;
  height: 1px; background: rgba(0,0,0,0.3);
}
.travel-steps {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.1em;
  color: rgba(247,246,241,0.6);
  text-transform: uppercase;
  animation: fade-cycle 6s ease-in-out infinite;
}
@keyframes fade-cycle {
  0%, 25% { opacity: 1; }
  33%, 66% { opacity: 0.3; }
  75%, 100% { opacity: 1; }
}
.glow-orb {
  position: absolute; left: 50%; top: 50%;
  width: 18rem; height: 18rem;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(60,131,207,0.22), transparent 70%);
  filter: blur(24px);
  pointer-events: none;
  animation: glow-pulse 3.4s ease-in-out infinite;
  z-index: -1;
}
@keyframes glow-pulse {
  0%, 100% { opacity: 0.38; transform: translate(-50%,-50%) scale(1); }
  50% { opacity: 0.85; transform: translate(-50%,-50%) scale(1.1); }
}

/* ─── Landing Scene ──────────────────────────────────────────── */
#phase-landing {
  align-items: flex-end; justify-content: center;
  padding: 1rem; padding-bottom: 2.5rem;
  background: linear-gradient(to top, rgba(6,27,52,0.7) 0%, transparent 60%);
}
.landing-card {
  width: 100%; max-width: 520px;
  padding: 1.75rem;
}
.landing-kicker {
  font-family: var(--font-mono);
  font-size: 0.7rem; letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 0.5rem;
}
.landing-title {
  font-family: var(--font-editorial);
  font-size: clamp(1.5rem, 4vw, 2.25rem);
  color: #fff; line-height: 1.25;
  margin-bottom: 1rem;
}
.landing-desc {
  font-size: 0.95rem; line-height: 1.65;
  color: rgba(255,255,255,0.75);
  margin-bottom: 1.5rem;
}
.enter-btn {
  display: inline-flex; align-items: center; gap: 0.5rem;
  padding: 0.8rem 1.75rem;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 9999px;
  color: #fff; font-weight: 600; font-size: 0.95rem;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
}
.enter-btn:hover { background: rgba(255,255,255,0.25); transform: translateY(-1px); }

/* ─── Dilemma Card ───────────────────────────────────────────── */
#phase-dilemma {
  align-items: flex-end; justify-content: center;
  padding: 1rem;
  padding-top: 4rem;
}
@media (min-width: 768px) {
  #phase-dilemma { align-items: center; justify-content: flex-end; padding: 2rem; }
}
.dilemma-panel {
  width: 100%; max-width: min(560px, calc(100vw - 2rem));
  max-height: calc(100dvh - 5rem);
  overflow-y: auto;
  overflow-x: hidden;
  padding: 1.25rem;
  border-radius: 1.5rem;
}
.dilemma-place {
  display: flex; align-items: center; gap: 0.4rem;
  font-size: 0.8rem;
  margin-bottom: 1rem;
}
.pin-icon { color: var(--accent); font-size: 0.85rem; }
.dilemma-place strong { font-weight: 600; color: var(--text); }
.dilemma-place span { color: var(--faint); }
.dilemma-place em { color: var(--muted); font-style: normal; }
.dilemma-title {
  font-family: var(--font-editorial);
  font-size: clamp(1.4rem, 3.5vw, 2rem);
  color: var(--text);
  line-height: 1.25;
  margin-bottom: 0.85rem;
}
.dilemma-scene {
  font-size: 0.92rem; line-height: 1.65;
  color: var(--muted);
  margin-bottom: 1.1rem;
}
.dilemma-question-lead {
  font-size: 0.8rem; line-height: 1.5;
  color: var(--faint);
  margin-bottom: 0.3rem;
}
.dilemma-question {
  font-size: 1.05rem; font-weight: 600;
  color: var(--text); line-height: 1.4;
  margin-bottom: 1rem;
}
.choices-list { display: grid; gap: 0.6rem; }
.choice-btn {
  display: grid; grid-template-columns: 2.25rem 1fr;
  align-items: flex-start; gap: 0.875rem;
  padding: 0.875rem;
  border-radius: 1rem;
  text-align: left; cursor: pointer;
  transition: transform 0.12s;
  width: 100%;
}
.choice-btn:hover { transform: translateY(-2px); }
.choice-index {
  width: 2.25rem; height: 2.25rem;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: rgba(143,199,232,0.06);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 0.75rem;
  color: var(--muted);
  transition: border-color 0.15s, color 0.15s;
  flex-shrink: 0;
}
.choice-btn:hover .choice-index { border-color: var(--accent); color: var(--accent); }
.choice-label { font-size: 0.9rem; font-weight: 600; color: var(--text); line-height: 1.3; }
.choice-desc { font-size: 0.8rem; font-weight: 400; color: var(--muted); line-height: 1.4; margin-top: 0.2rem; }
.custom-answer-area {
  margin-top: 0.6rem;
  padding: 0.875rem;
  border-radius: 1rem;
}
.custom-textarea {
  width: 100%; resize: none;
  background: transparent;
  border: none; outline: none;
  font-family: var(--font-body); font-size: 0.9rem;
  color: var(--text); min-height: 3rem;
}
.custom-textarea::placeholder { color: var(--faint); }
.submit-custom {
  display: inline-flex; align-items: center;
  margin-top: 0.5rem;
  padding: 0.5rem 1.1rem;
  background: var(--accent);
  color: #0a1a2e;
  border: none; border-radius: 9999px;
  font-weight: 600; font-size: 0.85rem;
  cursor: pointer;
  transition: opacity 0.2s;
}
.submit-custom:hover { opacity: 0.85; }

/* ─── Consequence ────────────────────────────────────────────── */
#phase-consequence {
  align-items: center; justify-content: center;
  padding: 1.5rem;
}
.consequence-panel {
  width: 100%; max-width: 42rem;
  padding: 1.75rem 2rem;
  border-radius: 2rem;
  max-height: calc(100dvh - 3rem);
  overflow-y: auto;
}
.consequence-kicker {
  font-family: var(--font-mono);
  font-size: 0.78rem; letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent-warm);
}
.consequence-title {
  font-family: var(--font-editorial);
  font-size: 1.75rem;
  color: var(--text); margin-top: 0.75rem;
}
.consequence-body {
  font-size: 1rem; line-height: 1.75;
  color: var(--muted); margin-top: 1.25rem;
}
.reflection-area {
  margin-top: 1.5rem;
  padding: 1rem;
  border-radius: 1rem;
}
.reflection-label {
  font-size: 0.85rem; font-weight: 500;
  color: var(--muted); margin-bottom: 0.5rem;
}
.reflection-input {
  width: 100%; resize: none;
  background: transparent; border: none; outline: none;
  font-family: var(--font-body); font-size: 0.9rem;
  color: var(--text); min-height: 3rem;
}
.reflection-input::placeholder { color: var(--faint); }
.action-row {
  display: flex; flex-wrap: wrap; gap: 0.75rem;
  margin-top: 1.75rem;
}
.btn-back {
  display: inline-flex; align-items: center; gap: 0.5rem;
  padding: 0.75rem 1.25rem;
  border-radius: 9999px;
  font-weight: 600; font-size: 0.9rem;
  cursor: pointer;
  color: var(--text);
  transition: transform 0.12s;
}
.btn-back:hover { transform: translateY(-1px); }
.btn-continue {
  display: inline-flex; align-items: center; gap: 0.5rem;
  padding: 0.75rem 1.5rem;
  background: var(--accent);
  color: #0a1a2e;
  border: none; border-radius: 9999px;
  font-weight: 600; font-size: 0.9rem;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(60,131,207,0.25);
  transition: opacity 0.2s, transform 0.15s;
}
.btn-continue:hover { opacity: 0.88; transform: translateY(-1px); }

/* ─── Itinerary Strip ────────────────────────────────────────── */
#itinerary-strip {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30;
  display: none;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(6,27,52,0.1);
  padding: 0.5rem 1rem;
}
#itinerary-strip.visible { display: flex; align-items: center; gap: 0; }
.itin-stop {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 0.3rem 0.5rem;
  border-right: 1px dotted rgba(6,27,52,0.18);
  min-width: 0;
}
.itin-stop:last-child { border-right: none; }
.itin-stop-label {
  font-family: var(--font-mono);
  font-size: 0.58rem; letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(6,27,52,0.4);
}
.itin-stop-city {
  font-size: 0.75rem; font-weight: 600;
  color: var(--night);
  white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; max-width: 100%;
}
.itin-stop.current .itin-stop-city { color: var(--signal); }
.itin-stop.upcoming .itin-stop-city { color: rgba(6,27,52,0.35); font-weight: 400; }
.itin-stop.current .itin-stop-label { color: var(--signal); }

/* ─── Final Report ───────────────────────────────────────────── */
#phase-report {
  overflow-y: auto; padding: 2rem 1rem;
}
.report-inner {
  display: grid; max-width: 64rem;
  margin: 0 auto;
  gap: 1.25rem;
}
@media (min-width: 1024px) {
  .report-inner { grid-template-columns: 1fr 0.9fr; }
}
.report-panel {
  padding: 1.5rem 2rem;
  border-radius: 2rem;
}
.report-kicker {
  font-family: var(--font-mono);
  font-size: 0.72rem; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--accent);
}
.report-title {
  font-family: var(--font-editorial);
  font-size: clamp(2rem, 5vw, 3.5rem);
  color: var(--text); line-height: 1.1;
  margin-top: 0.75rem;
}
.report-narrative {
  font-size: 1.05rem; line-height: 1.75;
  color: var(--muted); margin-top: 1.5rem;
}
.report-meta-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 0.75rem; margin-top: 1.75rem;
}
.report-meta-card {
  padding: 1rem;
  border-radius: 1rem;
}
.report-meta-label {
  font-size: 0.8rem; color: var(--faint);
}
.report-meta-val {
  font-size: 1.2rem; font-weight: 600;
  color: var(--text); margin-top: 0.25rem;
}
.value-bar-list { margin-top: 1.25rem; display: grid; gap: 0.75rem; }
.value-bar-row { display: grid; grid-template-columns: 8rem 1fr; align-items: center; gap: 0.75rem; }
.value-bar-name { font-size: 0.82rem; color: var(--muted); }
.value-bar-track {
  height: 0.4rem; background: var(--card);
  border-radius: 9999px; overflow: hidden;
}
.value-bar-fill {
  height: 100%; border-radius: 9999px;
  background: linear-gradient(90deg, var(--signal), var(--night));
  transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
}
.dilemma-log { margin-top: 1.25rem; display: grid; gap: 0.5rem; }
.dilemma-log-item {
  padding: 0.75rem 1rem;
  border-radius: 1rem;
  font-size: 0.83rem; line-height: 1.5;
  color: var(--muted);
}
.report-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.75rem; }
.btn-primary {
  display: inline-flex; align-items: center; gap: 0.5rem;
  padding: 0.75rem 1.5rem;
  background: var(--accent); color: #0a1a2e;
  border: none; border-radius: 9999px;
  font-weight: 600; cursor: pointer;
  transition: opacity 0.2s;
}
.btn-primary:hover { opacity: 0.85; }
.dominant-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem; }
.dominant-chip {
  padding: 0.3rem 0.75rem;
  border-radius: 9999px;
  background: rgba(60,131,207,0.1);
  font-size: 0.8rem; font-weight: 500;
  color: var(--accent);
}

/* ─── Transitions ────────────────────────────────────────────── */
.phase { opacity: 0; transition: opacity 0.45s; }
.phase.active { opacity: 1; }
.fade-in { animation: fade-in 0.45s ease-out forwards; }
@keyframes fade-in {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ─── Scrollbar ──────────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 9999px; }
</style>

// ─── Phase transitions ──────────────────────────────────────────
function goTo(phase) {
  document.querySelectorAll('.phase').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('phase-' + phase);
  if (el) {
    el.classList.add('active');
    // re-trigger fade animation
    el.querySelectorAll('.fade-in').forEach(e => {
      e.style.animation = 'none';
      void e.offsetHeight;
      e.style.animation = '';
    });
  }
  state.phase = phase;
  updateBackdrops();
  updateItinerary();
}

function updateBackdrops() {
  const globe = document.getElementById('globe');
  const starfield = document.getElementById('starfield');
  const aurora = document.getElementById('aurora');
  const bgSky = document.getElementById('bg-sky');
  const bgCloud = document.getElementById('bg-cloud-band');
  const vignette = document.getElementById('vignette');
  const isIntro = state.phase === 'intro';
  const isPersona = state.phase === 'persona';
  const zoomed = ['landing','dilemma','consequence'].includes(state.phase);

  if (isIntro) {
    starfield.style.display = 'block'; aurora.style.display = 'block';
    bgSky.style.display = 'none'; bgCloud.style.display = 'none';
    globe.classList.remove('zoomed');
  } else if (isPersona) {
    starfield.style.display = 'block'; aurora.style.display = 'block';
    bgSky.style.display = 'none'; bgCloud.style.display = 'none';
    globe.classList.remove('zoomed');
  } else {
    starfield.style.display = 'none'; aurora.style.display = 'none';
    bgSky.style.display = 'block'; bgCloud.style.display = 'block';
    bgSky.style.opacity = zoomed ? '0' : '1';
    bgCloud.style.opacity = zoomed ? '0' : '0.9';
    if (zoomed) globe.classList.add('zoomed');
    else globe.classList.remove('zoomed');
  }
}

  });

function buildChips(containerId, chips, field) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  chips.forEach(chip => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = chip;
    btn.onclick = () => appendChipToField(field, chip, btn);
    container.appendChild(btn);
  });
}

function appendChipToField(field, chip, btn) {
  btn.classList.toggle('active');
  const input = document.getElementById('input-' + field);
  const current = input.value.trim();
  if (btn.classList.contains('active')) {
    input.value = current ? current + ', ' + chip : chip;
  } else {
    input.value = current.replace(new RegExp(',?\\s*' + chip.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ',?\\s*', 'g'), ' ').trim().replace(/^,|,$/g, '').trim();
  }
  updateFieldVal(field, input.value);
}

function setFieldPlaceholder(field, text) {
  const el = document.getElementById('val-' + field);
  if (!el.dataset.filled) {
    el.textContent = text;
    el.classList.add('placeholder');
  }
}

function toggleField(field) {
  const fields = ['role','future','hope'];
  fields.forEach(f => {
    const exp = document.getElementById('exp-' + f);
    if (f === field) {
      const isOpen = exp.classList.contains('open');
      exp.classList.toggle('open', !isOpen);
      openField = isOpen ? null : f;
    } else {
      exp.classList.remove('open');
    }
  });
}

function selectRole(roleKey, roleLabel) {
  state.answers.role = roleKey;
  const el = document.getElementById('val-role');
  el.textContent = roleLabel;
  el.classList.remove('placeholder');
  el.dataset.filled = '1';
  document.getElementById('exp-role').classList.remove('open');
  document.querySelectorAll('#role-grid .role-btn').forEach(btn => btn.classList.remove('selected'));
  event.currentTarget && event.currentTarget.classList.add('selected');
  checkCanCheckIn();
}

function updateFieldVal(field, value) {
  const el = document.getElementById('val-' + field);
  if (value && value.trim()) {
    el.textContent = value.length > 38 ? value.substring(0,38) + '…' : value;
    el.classList.remove('placeholder');
    el.dataset.filled = '1';
    if (field === 'future') state.answers.future = value;
    if (field === 'hope') state.answers.hope = value;
  } else {
    el.dataset.filled = '';
    el.classList.add('placeholder');
  }
  checkCanCheckIn();
}

  const stepsEl = document.getElementById('travel-steps');
  stepsEl.textContent = steps[0];
  const stepInterval = setInterval(() => {
    si = (si + 1) % steps.length;
    stepsEl.textContent = steps[si];
  }, 2000);

  // Animate year counter 2026 → 2046
  animateYear(2026, 2046, 2400);

  // Load next dilemma + transition after delay
  const dilemma = DILEMMAS[state.dilemmaIndex];
  state.activeDilemma = dilemma;

  setTimeout(() => {
    clearInterval(stepInterval);
    showLanding(dilemma);
  }, 3000);
}

function animateYear(from, to, duration) {
  const digits = ['d0','d1','d2','d3'];
  const start = performance.now();
  function frame(now) {
    const progress = Math.min((now - start) / duration, 1);
    const ease = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
    const year = Math.round(from + (to - from) * ease);
    const str = String(year);
    digits.forEach((id, i) => {
      document.getElementById(id).textContent = str[i] || '';
    });
    if (progress < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// ─── Landing ───────────────────────────────────────────────────
function showLanding(dilemma) {
  const tx = t();
  document.getElementById('landing-kicker').textContent = tx.landingIn + ' ' + dilemma.city;
  document.getElementById('landing-title').textContent = dilemma.title;
  document.getElementById('landing-desc').textContent = dilemma.landingDesc;
  document.getElementById('landing-enter-text').textContent = tx.landingEnter;
  goTo('landing');
}

function enterDilemma() {
  renderDilemma(state.activeDilemma);
  goTo('dilemma');
}

// ─── Dilemma ───────────────────────────────────────────────────
function renderDilemma(dilemma) {
  const tx = t();
  document.getElementById('dilemma-city').textContent = dilemma.exactPlace + ', ' + dilemma.country;
  document.getElementById('dilemma-area').textContent = dilemma.problemArea;
  document.getElementById('dilemma-title').textContent = dilemma.title;
  document.getElementById('dilemma-scene').textContent = dilemma.scenePrompt;
  document.getElementById('dilemma-lead').textContent = (state.persona ? state.persona.title + ', ' : '') + tx.howCanI;
  document.getElementById('dilemma-question').textContent = dilemma.question;

  const list = document.getElementById('choices-list');
  list.innerHTML = '';
  dilemma.choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn surface-control';
    btn.innerHTML = `<span class="choice-index">${String(i+1).padStart(2,'0')}</span><span><span class="choice-label">${choice.label}</span>${choice.description ? `<span class="choice-desc">${choice.description}</span>` : ''}</span>`;
    btn.onclick = () => selectChoice(choice);
    list.appendChild(btn);
  });

  const customArea = document.getElementById('custom-answer');
  customArea.placeholder = tx.customPlaceholder;
  customArea.value = '';
  document.getElementById('custom-submit').textContent = tx.customSubmit;
  document.getElementById('custom-submit').style.display = 'none';
  customArea.oninput = () => {
    document.getElementById('custom-submit').style.display = customArea.value.trim() ? 'inline-flex' : 'none';
  };
}

function selectChoice(choice) {
  state.lastChoice = choice;
  state.lastCustomAnswer = null;
  applyValueImpacts(choice.valueImpacts);
  showConsequence(choice, null);
}

function submitCustom() {
  const val = document.getElementById('custom-answer').value.trim();
  if (!val) return;
  state.lastChoice = null;
  state.lastCustomAnswer = val;
  showConsequence(null, val);
}

function applyValueImpacts(impacts) {
  if (!impacts) return;
  Object.keys(impacts).forEach(key => {
    if (state.valueProfile[key] !== undefined) {
      state.valueProfile[key] += impacts[key];
    }
  });
}

// ─── Consequence ────────────────────────────────────────────────
function renderConsequence() {
  const tx = t();
  document.getElementById('consequence-kicker').textContent = tx.consequenceKicker;
  document.getElementById('reflection-label').textContent = tx.reflectionPrompt;
  document.getElementById('reflection-input').placeholder = tx.reflectionPlaceholder;
  document.getElementById('btn-back-text').textContent = tx.back;
  document.getElementById('btn-continue-text').textContent = tx.continueJourney;
}

function showConsequence(choice, customAnswer) {
  const tx = t();
  renderConsequence();

  const title = customAnswer ? tx.consequenceOwnPath : (choice ? choice.label : '');
  document.getElementById('consequence-title').textContent = title;

  let body = '';
  if (customAnswer) {
    body = state.lang === 'da'
      ? `Din egen løsning åbner en ny vej, der ikke stod på listen. Det kræver mod at gå egne veje — men det kan også skabe forandringer, ingen andre har tænkt på.`
      : `Your own solution opens a new path not on the list. It takes courage to go your own way — but it can also create changes nobody else has thought of.`;
  } else if (choice && choice.consequence) {
    body = choice.consequence;
  } else {
    body = state.lang === 'da'
      ? 'Dit valg har konsekvenser for de mennesker, der lever på dette sted. Teknologien reagerer på din beslutning.'
      : 'Your choice has consequences for the people living in this place. The technology responds to your decision.';
  }
  document.getElementById('consequence-body').textContent = body;
  document.getElementById('reflection-input').value = '';

  goTo('consequence');
}

function backToDilemma() {
  // Undo value impacts if choice was made
  if (state.lastChoice && state.lastChoice.valueImpacts) {
    Object.keys(state.lastChoice.valueImpacts).forEach(key => {
      if (state.valueProfile[key] !== undefined) {
        state.valueProfile[key] -= state.lastChoice.valueImpacts[key];
      }
    });
  }
  goTo('dilemma');
}

function continueJourney() {
  const reflection = document.getElementById('reflection-input').value.trim();
  const dilemma = state.activeDilemma;

  // Log completed dilemma
  state.completedDilemmas.push({
    dilemmaId: dilemma.id,
    city: dilemma.city,
    country: dilemma.country,
    problemArea: dilemma.problemArea,
    selectedChoiceLabel: state.lastCustomAnswer ? (state.lang === 'da' ? 'Egen løsning' : 'Own solution') : (state.lastChoice ? state.lastChoice.label : ''),
    reflection: reflection,
  });

  state.dilemmaIndex++;

  if (state.dilemmaIndex < DILEMMAS.length) {
    startTravel(false);
  } else {
    showReport();
  }
}

// ─── Itinerary strip ───────────────────────────────────────────
function updateItinerary() {
  const strip = document.getElementById('itinerary-strip');
  const showStrip = !['intro','persona','traveling','report'].includes(state.phase);
  strip.classList.toggle('visible', showStrip);

  if (!showStrip) return;
  strip.innerHTML = '';

  for (let i = 0; i < DILEMMAS.length; i++) {
    const div = document.createElement('div');
    let cls = 'itin-stop';
    let city = 'TBD';

    if (i < state.completedDilemmas.length) {
      city = state.completedDilemmas[i].city;
    } else if (i === state.completedDilemmas.length && state.activeDilemma) {
      city = state.activeDilemma.city;
      cls += ' current';
    } else {
      cls += ' upcoming';
    }

    div.className = cls;
    div.innerHTML = `<div class="itin-stop-label">STOP ${String(i+1).padStart(2,'0')}</div><div class="itin-stop-city">${city}</div>`;
    strip.appendChild(div);
  }
}

// ─── Report ────────────────────────────────────────────────────
function showReport() {
  renderReport();
  goTo('report');
}

function getDominantValues(profile, n) {
  return Object.entries(profile)
    .sort(([,a],[,b]) => b - a)
    .slice(0, n);
}

function inferAiAttitude(profile) {
  const score = profile.trust + profile.innovation - profile.safety - profile.localControl;
  if (score > 3) return state.lang === 'da' ? 'Optimistisk' : 'Optimistic';
  if (score < -2) return state.lang === 'da' ? 'Skeptisk' : 'Sceptical';
  return state.lang === 'da' ? 'Pragmatisk' : 'Pragmatic';
}

function renderReport() {
  const tx = t();
  const profile = state.valueProfile;
  const dominant = getDominantValues(profile, 4);

  document.getElementById('report-kicker').textContent = tx.reportKicker;
  document.getElementById('meta-ai-label').textContent = tx.reportAiAttitude;
  document.getElementById('meta-ai-val').textContent = inferAiAttitude(profile);
  document.getElementById('meta-gov-label').textContent = tx.reportGovernance;
  document.getElementById('meta-gov-val').textContent = profile.localControl >= profile.efficiency ? tx.reportGovLocal : tx.reportGovEfficient;
  document.getElementById('meta-col-label').textContent = tx.reportCollective;
  document.getElementById('meta-col-val').textContent = (profile.equality + profile.humanContact) >= profile.freedom ? tx.reportCollFirst : tx.reportIndFirst;
  document.getElementById('meta-trust-label').textContent = tx.reportTrust;
  document.getElementById('meta-trust-val').textContent = (profile.trust + profile.transparency) >= profile.safety ? tx.reportTrustInsight : tx.reportSafeControl;

  // Narrative
  const idx = Math.floor(Math.random() * tx.narratives.length);
  document.getElementById('report-title').textContent = tx.reportTitle;
  document.getElementById('report-narrative').textContent = tx.narratives[idx];

  document.getElementById('btn-restart').textContent = tx.restart;
  document.getElementById('report-profile-title').textContent = tx.reportProfile;
  document.getElementById('report-dominant-title').textContent = tx.reportDominant;
  document.getElementById('report-solved-title').textContent = tx.reportSolved;

  // Value bars
  const maxVal = Math.max(...Object.values(profile), 1);
  const barsEl = document.getElementById('value-bars');
  barsEl.innerHTML = '';
  Object.entries(profile).forEach(([key, val]) => {
    const row = document.createElement('div');
    row.className = 'value-bar-row';
    const pct = Math.max(0, Math.min(100, (val / Math.max(maxVal, 3)) * 100));
    row.innerHTML = `<div class="value-bar-name">${tx.valueLabels[key]}</div><div class="value-bar-track"><div class="value-bar-fill" style="width:${pct}%"></div></div>`;
    barsEl.appendChild(row);
  });

  // Dominant chips
  const chipsEl = document.getElementById('dominant-chips');
  chipsEl.innerHTML = '';
  dominant.forEach(([key]) => {
    const span = document.createElement('span');
    span.className = 'dominant-chip';
    span.textContent = tx.valueLabels[key];
    chipsEl.appendChild(span);
  });

  // Dilemma log
  const logEl = document.getElementById('dilemma-log');
  logEl.innerHTML = '';
  state.completedDilemmas.forEach(item => {
    const div = document.createElement('div');
    div.className = 'dilemma-log-item surface-card';
    div.innerHTML = `<strong>${item.city}, ${item.country}</strong>: ${item.problemArea} · ${item.selectedChoiceLabel}${item.reflection ? `<p style="font-style:italic;margin-top:0.3rem;opacity:0.7">"${item.reflection}"</p>` : ''}`;
    logEl.appendChild(div);
  });
}

function restartApp() {
  state = {
    lang: state.lang, phase: 'intro',
    answers: { role: '', future: '', hope: '' },
    persona: null, dilemmaIndex: 0, activeDilemma: null,
    lastChoice: null, lastCustomAnswer: null,
    completedDilemmas: [],
    valueProfile: { trust:0, freedom:0, equality:0, efficiency:0, humanContact:0, safety:0, innovation:0, sustainability:0, localControl:0, transparency:0 },
    reflection: '',
  };
  // Reset persona form
  document.getElementById('boarding-form').style.display = '';
  document.getElementById('boarding-stub').classList.remove('visible');
  document.getElementById('persona-footer').style.display = '';
  document.getElementById('persona-loading').style.display = 'none';
  ['role','future','hope'].forEach(f => {
    const el = document.getElementById('val-' + f);
    el.dataset.filled = '';
    el.classList.add('placeholder');
    const input = document.getElementById('input-' + f);
    if (input) input.value = '';
    document.getElementById('exp-' + f).classList.remove('open');
  });
  document.getElementById('checkin-btn').disabled = true;

  goTo('intro');
  renderAll();
}

// ─── Boot ──────────────────────────────────────────────────────
renderAll();
updateBackdrops();
renderPersonaUI();

// Scroll-snap progress for intro
const introEl = document.getElementById('phase-intro');
let startBtnShown = false;
introEl.addEventListener('scroll', () => {
  const pct = introEl.scrollTop / (introEl.scrollHeight - introEl.clientHeight);
  if (pct > 0.85 && !startBtnShown) {
    startBtnShown = true;
    document.getElementById('start-btn').style.opacity = '1';
  }
});
document.getElementById('start-btn').style.opacity = '0';
document.getElementById('start-btn').style.transition = 'opacity 0.5s';
// Show it immediately if they somehow don't scroll
setTimeout(() => {
  document.getElementById('start-btn').style.opacity = '1';
}, 800);
</script>
